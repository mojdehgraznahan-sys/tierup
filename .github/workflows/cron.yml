# Runs TierUp's frequent background jobs every 5 minutes (reminders, request expiry,
# ending Meets, report alerts, unread-message emails). Vercel's free plan only allows
# daily cron jobs, so the frequent schedule lives here.
# Needs repository secrets: APP_URL (e.g. https://tierup.app) and CRON_SECRET.
name: Background jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/all
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/all"
