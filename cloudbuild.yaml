# Cloud Build pipeline: migrate the database, build the image, deploy to Cloud Run.
# Triggered on pushes to main (see DEPLOY.md › Cloud Build trigger).
# Service configuration (env vars, secrets, service account) is set once on the Cloud Run
# service, so each deploy here only swaps the image.

substitutions:
  _REGION: us-east4
  _SERVICE: tierup
  _REPO: tierup

steps:
  # 1. Apply pending Prisma migrations (DIRECT_URL = Supabase session pooler).
  - id: migrate
    name: node:20-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq openssl > /dev/null
        npm ci --ignore-scripts --no-audit --no-fund
        npx prisma migrate deploy
    secretEnv: [DATABASE_URL, DIRECT_URL]

  # 2. Build and push the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app"]

  # 3. Roll out the new image (keeps the service's existing env, secrets and settings).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
      - --region=${_REGION}

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/DIRECT_URL/versions/latest
      env: DIRECT_URL

options:
  logging: CLOUD_LOGGING_ONLY
